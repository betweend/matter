---
version: 9.2.0-noattest.1
slug: matter_server_noattest
name: Matter Server (attestation opt-in)
description: Local matter.js Matter Server with an opt-in attestation-failure bypass.
url: https://github.com/matter-js/matterjs-server/tree/v1.4.0
arch:
  - aarch64
  - amd64
discovery:
  - matter
hassio_api: true
homeassistant: 2024.6.0
host_ipc: false
host_network: true
host_dbus: true
ingress: true
ingress_port: 5580
panel_icon: mdi:matter
init: false
map:
  - type: app_config
    read_only: false
options:
  log_level: info
  enable_test_net_dcl: false
  allow_attestation_failure: false
  time_sync: auto
  matter_server_args: []
  matter_server_env_vars: []
schema:
  log_level: list(debug|info|notice|warn|error|fatal|verbose|warning|critical)
  enable_test_net_dcl: bool?
  allow_attestation_failure: bool
  time_sync: list(auto|on|off)
  default_fabric_label: match(^.{1,32}$)?
  ble_proxy: bool?
  bluetooth_adapter_id: int?
  matter_server_args:
    - str?
  matter_server_env_vars:
    - match(^[A-Za-z_][A-Za-z0-9_]*=.*$)?
ports:
  5580/tcp: null
stage: experimental
startup: services
